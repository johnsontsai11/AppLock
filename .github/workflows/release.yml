name: Release

# Push a tag like v2.5.2 (matching versionName in app/build.gradle.kts) to build
# the release APK and publish it as a GitHub release.
#
# Optional signing secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of your .jks/.keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Without them the APK is signed with the runner's throwaway debug key, so
# each release has a different signature and can't install over the previous one.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "APPLOCK_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Warn about missing signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No KEYSTORE_BASE64 secret set; the APK is signed with a throwaway debug key."

      - name: Build release APK
        env:
          APPLOCK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APPLOCK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APPLOCK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "AppLock-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: AppLock-${{ github.ref_name }}.apk
          generate_release_notes: true
